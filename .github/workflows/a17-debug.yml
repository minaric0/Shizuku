name: SM-A175N Android 17 debug APK

on:
  push:
    branches: [feature/sm-a175n-oneui9-android17]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 17 toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;3.31.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable debug APK
        run: ./gradlew :manager:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shizuku-sm-a175n-android17-debug
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
